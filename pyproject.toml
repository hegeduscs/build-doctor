[project]
name = "build-doctor"
version = "0.1.0"
description = "Capstone: agentic fejlesztői asszisztens elbukott CI futások kivizsgálására (evopro AI oktatás, 2026)"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=4.1,<5",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pyyaml>=6",
    "pydantic>=2.9",
    "openai>=2",
    "pytest>=8",
]

[project.optional-dependencies]
smolagents = ["smolagents>=1.24"]
llamaindex = [
    "llama-index-core>=0.14",
    "llama-index-tools-mcp>=0.6",
    "llama-index-llms-openai>=0.5",
    "llama-index-llms-azure-openai>=0.4",
    "llama-index-llms-openai-like>=0.5",
]
langgraph = ["langchain>=1.0", "langgraph>=1.0", "langchain-openai>=1.0"]
all = [
    "smolagents>=1.24",
    "llama-index-core>=0.14",
    "llama-index-tools-mcp>=0.6",
    "llama-index-llms-openai>=0.5",
    "llama-index-llms-azure-openai>=0.4",
    "llama-index-llms-openai-like>=0.5",
    "langchain>=1.0",
    "langgraph>=1.0",
    "langchain-openai>=1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = ["level2: a 2. szint (commitonkénti diff, titkok kitakarása, verify_patch)"]

[tool.uv]
package = false
# másolás hardlink helyett: az nltk 3.10+ nem nyit meg hardlinkelt fájlt (a LlamaIndex használja)
link-mode = "copy"
